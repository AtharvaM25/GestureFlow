[project]
name = "gestureflow"
version = "0.4.0"
description = "Landmark-based hand gesture recognition: normalize, render, classify."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- vision / landmarks ---
    "mediapipe>=0.10.18,<0.11",   # 1.x and OpenCV 5.x are untested here
    "cvzone>=2.0.0",          # 2.x uses the MediaPipe Tasks API (hand_landmarker.task)
    # mediapipe needs opencv-contrib-python, cvzone needs opencv-python. Both ship the
    # same cv2 module, so they must resolve to the same version or one overwrites the other.
    "opencv-python>=4.8.0,<5",
    "opencv-contrib-python>=4.8.0,<5",
    # --- model ---
    "torch>=2.2,<2.14",
    # --- data + evaluation (imported by training, evaluation and the preview; previously undeclared) ---
    "numpy>=1.26,<3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    # --- sentence post-editing (optional at runtime) ---
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "python-dotenv>=1.0.0",
    # --- web API (backend/) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "langchain-groq>=0.3",
]

# Removed vs 0.1.0, with reasons:
#   tensorflow      -- ~500MB pinned for keras_model.h5, which no module imports.
#   protobuf        -- transitive via mediapipe; pinning it here caused resolver conflicts.
# Changed:
#   numpy           -- >=2.0.2 was irreconcilable with requirements.txt's "<1.24.0". Widened.
#   requires-python -- was ">=3.9". Pinned to 3.12 so requirements.txt holds exactly one
#                      version per package; MediaPipe wheels lag new Python releases.
#   cvzone >=2.0.0  -- 1.x used the legacy mp.solutions API; the code relies on 2.x.
#   torch           -- was absent entirely, so `uv sync` produced a tree that could not
#                      run CNN.py or M5_test.py at all.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "onnxruntime>=1.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
# errors, pyflakes, import order, modern syntax, common bugs
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]   # FastAPI's `param = Depends(...)` is the framework's intended pattern

[tool.ruff.lint.per-file-ignores]
"backend/migrations/versions/*" = ["E501"]   # generated by Alembic

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # lets tests import gestureflow without installing it

# On Linux (the Docker image), PyPI's torch pulls ~3 GB of CUDA libraries that CPU
# inference never uses. Take the CPU build from PyTorch's own index there instead.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
