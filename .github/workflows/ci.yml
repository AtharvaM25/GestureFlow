# Runs on every push and pull request. Each job uses exactly the commands from the README.
name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python — lint + tests (SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gestureflow
          POSTGRES_PASSWORD: gestureflow
          POSTGRES_DB: gestureflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gestureflow" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      # enables the migration + full-flow tests against PostgreSQL
      GESTUREFLOW_TEST_PG_URL: postgresql+psycopg://gestureflow:gestureflow@localhost:5432/gestureflow_test
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json   # pnpm version comes from "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:edge   # browser Edge-mode code vs the Python reference
      - run: pnpm build

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    env:
      GESTUREFLOW_JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
